# Deploy: build and publish to Cloudflare on every push to main (and on demand).
#   Web  → Cloudflare Pages project "intruva"  (https://intruva.pages.dev)
#   API  → Cloudflare Worker "intruva-api"     (only when services/api/wrangler.* exists)
#
# Requires repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (see DEPLOYMENT.md → "Automatic deploys"). Without them the deploy steps are
# skipped with a notice instead of failing the run.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running deploy rather than cancelling it mid-upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://intruva.pages.dev
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PAGES_PROJECT: intruva
      SITE_URL: https://intruva.pages.dev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repository secrets are not set. The build still runs; deploy steps are skipped. See DEPLOYMENT.md (Automatic deploys) or deploy manually with scripts/deploy.sh."
          fi

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test --workspaces --if-present

      - name: Build web (static export + MCP downloads)
        run: npm run build -w @intruva/web
        env:
          # Optional build-time settings: GitHub → Settings → Secrets and variables → Actions → Variables.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_INTRUVA_API_URL: ${{ vars.NEXT_PUBLIC_INTRUVA_API_URL }}
          NEXT_PUBLIC_INTRUVA_API_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_INTRUVA_API_PUBLIC_URL }}
          NEXT_PUBLIC_FEEDBACK_URL: ${{ vars.NEXT_PUBLIC_FEEDBACK_URL }}

      - name: Deploy web to Cloudflare Pages
        id: pages
        if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.166.0"
          packageManager: npm
          command: >-
            pages deploy apps/web/out
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-dirty=false

      - name: Deploy API to Cloudflare Workers
        id: api
        if: steps.creds.outputs.ok == 'true' && hashFiles('services/api/wrangler.*') != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.166.0"
          packageManager: npm
          workingDirectory: services/api
          command: deploy

      - name: Smoke checks
        if: steps.creds.outputs.ok == 'true'
        env:
          PAGES_URL: ${{ steps.pages.outputs.deployment-url }}
          API_OUTPUT: ${{ steps.api.outputs.command-output }}
        run: |
          set -u
          fail=0
          check() { # check <want> <url>
            got=""
            for _ in 1 2 3 4 5 6; do
              got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$2" || true)
              [ "$got" = "$1" ] && break
              sleep 5
            done
            if [ "$got" = "$1" ]; then echo "ok   $got $2"; else echo "::error::$2 returned $got (want $1)"; fail=1; fi
          }
          for p in / /workspace/ /developers/ /privacy/ /downloads/manifest.json /downloads/intruva-mcp.tgz; do
            check 200 "$SITE_URL$p"
          done
          check 404 "$SITE_URL/this-route-does-not-exist-${GITHUB_RUN_ID}/"
          curl -sI "$SITE_URL/" | grep -qi '^x-content-type-options:' || { echo "::error::security headers missing"; fail=1; }
          api_url=$(printf '%s' "${API_OUTPUT:-}" | grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' | head -1 || true)
          if [ -n "$api_url" ]; then check 200 "$api_url/v1/health"; fi
          {
            echo "### Deployed"
            echo "- Web: $SITE_URL"
            if [ -n "${PAGES_URL:-}" ]; then echo "- This build: $PAGES_URL"; fi
            if [ -n "$api_url" ]; then echo "- API: $api_url"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $fail
